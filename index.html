<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма курса</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/telegram-web-app/6.7.0/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1c222b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #6ab2f2;
        }
        
        input, textarea {
            width: 100%;
            background-color: #131820;
            color: #ffffff;
            border: 1px solid #7d8699;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 16px;
        }
        
        button {
            background-color: #5288c1;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        
        #successMessage {
            display: none;
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background-color: rgba(46, 204, 113, 0.2);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <form id="courseForm">
        <label for="courseTopic">Тема курса:</label>
        <input type="text" id="courseTopic" name="courseTopic" required>
        
        <label for="subjectArea">Предметная область:</label>
        <input type="text" id="subjectArea" name="subjectArea" required>
        
        <label for="knowledgeLevel">Уровень знаний:</label>
        <input type="text" id="knowledgeLevel" name="knowledgeLevel" required>
        
        <label for="learningGoal">Цель обучения:</label>
        <input type="text" id="learningGoal" name="learningGoal" required>
        
        <label for="additionalComments">Дополнительные комментарии:</label>
        <textarea id="additionalComments" name="additionalComments" rows="4"></textarea>
        
        <button type="submit">Отправить</button>
    </form>
    
    <div id="successMessage">
        Форма успешно отправлена! Спасибо за заявку.
    </div>
    
    <script>
        // Инициализация Telegram WebApp
        const webApp = window.Telegram.WebApp;
        webApp.expand();
        webApp.ready();
        
        // Обработчик отправки формы
        document.getElementById('courseForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Сбор данных формы
            const formData = {
                courseTopic: document.getElementById('courseTopic').value,
                subjectArea: document.getElementById('subjectArea').value,
                knowledgeLevel: document.getElementById('knowledgeLevel').value,
                learningGoal: document.getElementById('learningGoal').value,
                additionalComments: document.getElementById('additionalComments').value
            };
            
            // Отправка данных в Telegram
            webApp.sendData(JSON.stringify(formData));
            
            // Показ сообщения об успехе
            document.getElementById('courseForm').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
            
            // Закрытие приложения через 3 секунды
            setTimeout(() => {
                webApp.close();
            }, 3000);
        });
    </script>
</body>
</html>
