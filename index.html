<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Форма курса</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            padding: 20px;
        }
        
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid var(--tg-theme-hint-color);
            background-color: var(--tg-theme-secondary-bg-color);
            color: var(--tg-theme-text-color);
            box-sizing: border-box;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--tg-theme-link-color);
            font-weight: bold;
        }
        
        textarea {
            height: 100px;
            resize: none;
        }
    </style>
</head>
<body>
    <div>
        <label for="courseTopic">ТЕМА КУРСА</label>
        <input type="text" id="courseTopic" placeholder="Введите тему курса">
        
        <label for="subjectArea">ПРЕДМЕТНАЯ ОБЛАСТЬ</label>
        <input type="text" id="subjectArea" placeholder="Введите предметную область">
        
        <label for="knowledgeLevel">УРОВЕНЬ ЗНАНИЙ</label>
        <input type="text" id="knowledgeLevel" placeholder="Введите уровень знаний">
        
        <label for="learningGoal">ЦЕЛЬ ОБУЧЕНИЯ</label>
        <input type="text" id="learningGoal" placeholder="Введите цель обучения">
        
        <label for="additionalComments">ДОПОЛНИТЕЛЬНЫЕ КОММЕНТАРИИ</label>
        <textarea id="additionalComments" placeholder="Введите комментарии"></textarea>
    </div>

    <script>
        // Самый простой скрипт без лишних проверок
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        // Настраиваем кнопку
        tg.MainButton.setText('ОТПРАВИТЬ');
        tg.MainButton.show();
        
        // Обработчик нажатия кнопки
        tg.MainButton.onClick(function() {
            // Собираем данные
            const data = {
                courseTopic: document.getElementById('courseTopic').value || 'Не указано',
                subjectArea: document.getElementById('subjectArea').value || 'Не указано',
                knowledgeLevel: document.getElementById('knowledgeLevel').value || 'Не указано',
                learningGoal: document.getElementById('learningGoal').value || 'Не указано',
                additionalComments: document.getElementById('additionalComments').value || ''
            };
            
            // Отправляем данные и закрываем приложение
            tg.sendData(JSON.stringify(data));
            
            // Через короткое время закрываем приложение
            setTimeout(function() {
                tg.close();
            }, 500);
        });
    </script>
</body>
</html>
