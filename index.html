<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>Форма курса</title>
    <style>
        body {
            --bg-color: var(--tg-theme-bg-color, #fff);
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--tg-theme-text-color, #222);
            font-size: 16px;
            margin: 0;
            padding: 0;
            color-scheme: var(--tg-color-scheme);
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--tg-theme-text-color, #222);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--tg-theme-text-color, #222);
            text-transform: uppercase;
            font-size: 14px;
        }

        input[type="text"],
        textarea {
            display: block;
            width: 100%;
            padding: 12px 20px;
            box-sizing: border-box;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 4px;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #222);
            font-size: 16px;
            resize: none;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #50a8eb);
        }

        .hint {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999);
            margin-top: 5px;
        }

        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }

        #status.success {
            background-color: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            display: block;
        }

        #status.error {
            background-color: rgba(244, 67, 54, 0.2);
            color: #F44336;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Форма создания курса</h1>
        <div class="form-group">
            <label for="courseTopic">Тема курса</label>
            <input type="text" id="courseTopic" placeholder="Введите тему курса">
            <div class="hint">Напишите тему, которую вы бы хотели изучить</div>
        </div>
        <div class="form-group">
            <label for="subjectArea">Предметная область</label>
            <input type="text" id="subjectArea" placeholder="Введите предметную область">
            <div class="hint">Укажите область необходимых знаний</div>
        </div>
        <div class="form-group">
            <label for="knowledgeLevel">Уровень знаний</label>
            <input type="text" id="knowledgeLevel" placeholder="Введите уровень сложности">
            <div class="hint">Укажите необходимый уровень сложности курса</div>
        </div>
        <div class="form-group">
            <label for="learningGoal">Цель обучения</label>
            <input type="text" id="learningGoal" placeholder="Введите цель обучения">
            <div class="hint">Укажите для каких целей вам нужен курс</div>
        </div>
        <div class="form-group">
            <label for="additionalComments">Дополнительные комментарии</label>
            <textarea id="additionalComments" placeholder="Введите дополнительную информацию" rows="3"></textarea>
            <div class="hint">Необязательное поле</div>
        </div>
        <div id="status"></div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Расширяем на всю высоту
        tg.ready(); // Сообщаем приложению, что страница загружена

        // Настройка главной кнопки
        tg.MainButton.setText('Отправить');
        tg.MainButton.show();
        
        const courseTopicInput = document.getElementById('courseTopic');
        const subjectAreaInput = document.getElementById('subjectArea');
        const knowledgeLevelInput = document.getElementById('knowledgeLevel');
        const learningGoalInput = document.getElementById('learningGoal');
        const additionalCommentsInput = document.getElementById('additionalComments');
        const statusElem = document.getElementById('status');

        // Простая валидация при нажатии на главную кнопку
        tg.MainButton.onClick(function() {
            // Собираем данные из формы
            const courseTopic = courseTopicInput.value.trim();
            const subjectArea = subjectAreaInput.value.trim();
            const knowledgeLevel = knowledgeLevelInput.value.trim();
            const learningGoal = learningGoalInput.value.trim();
            const additionalComments = additionalCommentsInput.value.trim();
            
            // Проверка обязательных полей
            if (courseTopic === '' || subjectArea === '' || knowledgeLevel === '' || learningGoal === '') {
                statusElem.textContent = 'Пожалуйста, заполните все обязательные поля';
                statusElem.className = 'error';
                return;
            }
            
            // Создаем объект с данными для отправки
            const formData = {
                courseTopic: courseTopic,
                subjectArea: subjectArea,
                knowledgeLevel: knowledgeLevel,
                learningGoal: learningGoal,
                additionalComments: additionalComments || ''
            };
            
            // Отправляем данные обратно в Telegram бот
            tg.sendData(JSON.stringify(formData));
            
            // Показываем сообщение об успешной отправке
            statusElem.textContent = 'Данные успешно отправлены!';
            statusElem.className = 'success';
            
            // Опционально: можно закрыть Mini App через некоторое время
            setTimeout(() => {
                tg.close();
            }, 2000);
        });
    </script>
</body>
</html>
